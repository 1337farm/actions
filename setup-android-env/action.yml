name: Setup Android SDK env
description: Point at the runner-preinstalled Android SDK, export SDK env vars, accept licenses. No downloads (JDK/NDK installed separately).
runs:
  using: composite
  steps:
    - name: Set up Android SDK env
      shell: bash
      run: |
        SDK=/usr/local/lib/android/sdk
        test -d "$SDK/cmdline-tools" || { echo "ERROR: preinstalled SDK missing at $SDK" >&2; exit 1; }
        echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
        echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
        echo "$SDK/cmdline-tools/latest/bin:$SDK/platform-tools" >> "$GITHUB_PATH"
        export PATH="$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$PATH"
        yes | sdkmanager --licenses >/dev/null 2>&1 || true
        sdkmanager --version
