name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: actionlint (workflow + action.yml syntax)
        shell: bash
        run: |
          mkdir -p /tmp/actionlint
          curl -fsSL -o /tmp/actionlint/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.4/actionlint_1.7.4_linux_x86_64.tar.gz
          tar -xzf /tmp/actionlint/actionlint.tar.gz -C /tmp/actionlint --strip-components=1
          /tmp/actionlint/actionlint -color \
            .github/workflows/*.yml \
            setup-jdk/action.yml \
            setup-android-env/action.yml \
            setup-android-ndk/action.yml \
            publish-release/action.yml \
            squash-merge/action.yml

      - name: shellcheck inline scripts (commentary; word-splitting is intentional)
        shell: bash
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq shellcheck >/dev/null
          fi
          if command -v shellcheck >/dev/null 2>&1; then
            python3 - <<'PY' || true
          import pathlib, re
          for f in ["setup-jdk", "setup-android-env", "setup-android-ndk", "publish-release", "squash-merge"]:
              text = pathlib.Path(f"{f}/action.yml").read_text()
              for i, m in enumerate(re.finditer(r"\n\s+run: \|\n(?P<body>(?:.*\n)+?)(?=\s+[A-Za-z-]+:|$)", text)):
                  body = m.group("body")
                  indent = min(len(l) - len(l.lstrip()) for l in body.splitlines())
                  p = pathlib.Path(f"/tmp/{f}-{i}.sh")
                  p.write_text("\n".join(l[indent:] for l in body.splitlines()))
                  print(f"{p.name}: {len(p.read_text().splitlines())} lines")
          PY
            for f in /tmp/setup-jdk-0.sh /tmp/setup-android-env-0.sh /tmp/setup-android-ndk-0.sh /tmp/publish-release-0.sh /tmp/publish-release-1.sh /tmp/publish-release-2.sh /tmp/squash-merge-*.sh; do
              [ -e "$f" ] || continue
              echo "--- shellcheck $f ---"
              shellcheck -x -S warning "$f" || true
            done
          else
            echo "shellcheck not available; skipping (non-blocking)"
          fi

  smoke:
    name: smoke-test actions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: setup-jdk (default 17, cached on re-run)
        id: jdk
        uses: ./setup-jdk

      - name: Verify JDK
        shell: bash
        run: |
          : "${JAVA_HOME:?JAVA_HOME must be exported}"
          java -version 2>&1 | head -1
          case "$(java -version 2>&1 | head -1)" in
            *'"17'*|*'17.'*) echo "JDK 17 OK" ;;
            *) echo "ERROR: unexpected JDK version"; java -version 2>&1 | head -3; exit 1 ;;
          esac

      - name: setup-jdk 21 (second version, arch-aware download)
        uses: ./setup-jdk
        with:
          java-version: "21"

      - name: Verify JDK 21
        shell: bash
        run: |
          java -version 2>&1 | head -1
          case "$(java -version 2>&1 | head -1)" in
            *'"21'*|*'21.'*) echo "JDK 21 OK" ;;
            *) echo "ERROR: unexpected JDK version"; java -version 2>&1 | head -3; exit 1 ;;
          esac

      - name: setup-android-env against runner-preinstalled SDK
        uses: ./setup-android-env

      - name: set up NDK via new action
        uses: ./setup-android-ndk
        with:
          ndk-version: "23.1.7779620"

      - name: Verify SDK + NDK env
        shell: bash
        run: |
          : "${ANDROID_SDK_ROOT:?ANDROID_SDK_ROOT must be exported}"
          : "${ANDROID_NDK_HOME:?ANDROID_NDK_HOME must be exported}"
          echo "SDK=$ANDROID_SDK_ROOT"
          echo "NDK=$ANDROID_NDK_HOME"
          [ -d "$ANDROID_NDK_HOME" ] || { echo "ERROR: NDK dir missing"; exit 1; }
          [ -d "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" ] || { echo "ERROR: NDK toolchain missing"; exit 1; }

      - name: Build fake publish assets
        shell: bash
        run: |
          mkdir -p /tmp/assets/fake-apk
          printf 'fake-apk' > /tmp/assets/fake-apk/app-debug.apk
          printf '{"fake":true}\n' > /tmp/assets/manifest.json

      - name: publish-release end-to-end (real rolling tag)
        uses: ./publish-release
        with:
          tag: "ci-smoke-${{ github.run_id }}"
          title: "CI smoke release"
          notes: "Verifies publish-release action end-to-end"
          files: "/tmp/assets/manifest.json /tmp/assets/fake-apk/*.apk"

      - name: Verify rolling release contents
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="ci-smoke-${{ github.run_id }}"
          gh release view "$TAG" --json tagName,assets --jq '{tag:.tagName, assets:[.assets[].name]}'
          gh release view "$TAG" --json assets --jq '.assets|length' | grep -qE '^2$' || { echo "ERROR: expected exactly 2 assets"; exit 1; }
          # Clean up the smoke tag so CI leaves no residue.
          gh release delete "$TAG" --yes --cleanup-tag || true

      - name: squash-merge smoke (preflight path only; nothing to merge here)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # Validate the preflight guard by pointing at a non-existent PR: it
          # must fail fast instead of throwing an opaque gh error.
          set +e
          gh pr view 999999 --json state --jq '.state' 2>/dev/null
          rc=$?
          set -e
          # The action itself would exit non-zero; here we just confirm gh sees
          # a bogus PR. Real squash-merge runs live in the consuming workflows.
          if [ "$rc" -ne 0 ]; then echo "preflight guard OK (missing PR detected)"; else echo "WARN: unexpected"; fi