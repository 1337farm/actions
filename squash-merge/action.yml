name: Squash-merge PR
description: >-
  Squash-merge a same-repo PR (and delete its branch). Intended as the last step
  of a green build. Preflights mergeability, is idempotent (already-merged PRs
  are a no-op), and tolerates protected head branches (delete failure is a
  warning, not a hard failure).
inputs:
  pr-number:
    description: Pull request number to merge
    required: true
  repo:
    description: owner/repo hosting the PR (defaults to caller repo)
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Verify repo input
      shell: bash
      env:
        INPUT_REPO: ${{ inputs.repo }}
      run: |
        set -euo pipefail
        if [ -n "$INPUT_REPO" ] && ! printf '%s' "$INPUT_REPO" | grep -qE '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'; then
          echo "ERROR: repo input must be 'owner/repo', got '$INPUT_REPO'" >&2
          exit 1
        fi

    - name: Preflight and merge
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        INPUT_PR: ${{ inputs.pr-number }}
        INPUT_REPO: ${{ inputs.repo }}
      run: |
        set -euo pipefail

        REPO_ARGS=()
        [ -n "$INPUT_REPO" ] && REPO_ARGS=(--repo "$INPUT_REPO")

        # Idempotence: already merged is success.
        if gh pr view "$INPUT_PR" "${REPO_ARGS[@]}" --json state --jq '.state' 2>/dev/null | grep -q MERGED; then
          echo "PR #$INPUT_PR is already merged; nothing to do."
          exit 0
        fi

        # Preflight: PR must exist and be mergeable.
        STATE="$(gh pr view "$INPUT_PR" "${REPO_ARGS[@]}" --json state --jq '.state')"
        [ "$STATE" = "OPEN" ] || { echo "ERROR: PR #$INPUT_PR is not open (state=$STATE)" >&2; exit 1; }

        MERGE_STATE="$(gh pr view "$INPUT_PR" "${REPO_ARGS[@]}" --json mergeStateStatus --jq '.mergeStateStatus')"
        case "$MERGE_STATE" in
          CLEAN | UNSTABLE)
            echo "PR #$INPUT_PR merge state: $MERGE_STATE"
            ;;
          BLOCKED | BEHIND | DIRTY | CHANGES_REQUESTED | DRAFT | UNKNOWN)
            echo "ERROR: PR #$INPUT_PR cannot be merged (mergeStateStatus=$MERGE_STATE)" >&2
            exit 1
            ;;
          *)
            echo "WARNING: unrecognized mergeStateStatus '$MERGE_STATE'; attempting merge" >&2
            ;;
        esac

        gh pr merge "$INPUT_PR" "${REPO_ARGS[@]}" --squash --delete-branch \
          || { echo "ERROR: squash merge of PR #$INPUT_PR failed" >&2; exit 1; }

        echo "Merged PR #$INPUT_PR"

        # Branch delete can fail on protected/in-use branches; that is a warning.
        HEAD_REF="$(gh pr view "$INPUT_PR" "${REPO_ARGS[@]}" --json headRefName --jq '.headRefName' 2>/dev/null || true)"
        if [ -n "$HEAD_REF" ]; then
          TARGET_REPO="${INPUT_REPO:-$GITHUB_REPOSITORY}"
          if gh api "repos/$TARGET_REPO/branches/$HEAD_REF" -X DELETE 2>/dev/null; then
            echo "Deleted head branch '$HEAD_REF'"
          else
            echo "WARNING: could not delete head branch '$HEAD_REF' (protected/in-use?)"
          fi
        fi